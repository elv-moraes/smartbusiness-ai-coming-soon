<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071019" />
    <meta
      name="description"
      content="O SmartBusiness AI ainda está sendo construído. Volte em breve para conhecer o projeto."
    />
    <title>SmartBusiness AI — Em breve</title>
    <style>
      :root {
        --ink: #071019;
        --cyan: #35d9ff;
        --cyan-bright: #8decff;
        --green: #5ee3a4;
        --paper: #f7fbff;
        --skin: #d99b72;
        --skin-light: #edb88c;
        --hair: #17202a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .page-shell {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(
            circle at 50% 54%,
            rgba(14, 93, 137, 0.2),
            transparent 28%
          ),
          linear-gradient(155deg, #0d1e2b 0%, #071019 52%, #03080d 100%);
      }

      .page-shell::before {
        position: absolute;
        inset: 0;
        z-index: -3;
        content: "";
        background:
          linear-gradient(
            90deg,
            transparent 49.8%,
            rgba(69, 208, 238, 0.05) 50%,
            transparent 50.2%
          ),
          linear-gradient(rgba(83, 210, 238, 0.025), transparent);
      }

      .background-grid {
        position: absolute;
        inset: 0;
        z-index: -2;
        opacity: 0.34;
        background-image:
          linear-gradient(rgba(90, 210, 240, 0.045) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(90, 210, 240, 0.045) 1px,
            transparent 1px
          );
        background-size: 52px 52px;
        mask-image: linear-gradient(to bottom, black, transparent 86%);
      }

      .ambient {
        position: absolute;
        z-index: -1;
        width: 36rem;
        height: 36rem;
        border-radius: 50%;
        filter: blur(120px);
      }

      .ambient-one {
        top: -24rem;
        left: -13rem;
        background: rgba(37, 163, 206, 0.14);
      }

      .ambient-two {
        right: -20rem;
        bottom: -28rem;
        background: rgba(39, 177, 128, 0.1);
      }

      .brand {
        position: absolute;
        top: clamp(1.25rem, 4vw, 2.75rem);
        left: 50%;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        width: min(68rem, calc(100% - 2rem));
        transform: translateX(-50%);
      }

      .brand-mark {
        display: grid;
        width: 2.45rem;
        height: 2.45rem;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid rgba(100, 223, 250, 0.45);
        border-radius: 0.8rem;
        background: linear-gradient(
          145deg,
          rgba(54, 199, 234, 0.25),
          rgba(26, 103, 145, 0.08)
        );
        box-shadow:
          inset 0 0 18px rgba(67, 213, 244, 0.13),
          0 0 24px rgba(35, 180, 221, 0.1);
        color: var(--cyan-bright);
        font-size: 0.78rem;
        font-weight: 850;
        letter-spacing: -0.04em;
      }

      .brand-name {
        color: #dcebf3;
        font-size: clamp(0.92rem, 2vw, 1.05rem);
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .brand-name strong {
        color: var(--cyan);
        font-weight: 800;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-left: auto;
        border: 1px solid rgba(128, 216, 203, 0.16);
        border-radius: 999px;
        padding: 0.48rem 0.78rem;
        background: rgba(7, 21, 29, 0.55);
        color: rgba(220, 239, 241, 0.62);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: 0.65rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        backdrop-filter: blur(12px);
      }

      .status-dot {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 50%;
        background: var(--green);
        animation: status-pulse 2s ease-out infinite;
      }

      .stage {
        position: relative;
        width: min(74rem, 100%);
        min-height: 100svh;
        margin: 0 auto;
      }

      .door-scene {
        --door-scale: 1;
        position: absolute;
        top: 55%;
        left: 46%;
        width: 268px;
        height: 430px;
        transform: translate(-50%, -50%) scale(var(--door-scale));
        transform-origin: center;
      }

      .door-light {
        position: absolute;
        top: -80px;
        left: 50%;
        z-index: -1;
        width: 420px;
        height: 520px;
        transform: translateX(-50%);
        background: radial-gradient(
          ellipse at 50% 58%,
          rgba(56, 217, 255, 0.15),
          transparent 62%
        );
        animation: room-breathe 5s ease-in-out infinite;
      }

      .floor-shadow {
        position: absolute;
        right: -96px;
        bottom: 8px;
        left: -96px;
        height: 36px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse,
          rgba(0, 0, 0, 0.8),
          transparent 68%
        );
        filter: blur(5px);
      }

      .door-frame {
        position: absolute;
        top: 10px;
        left: 14px;
        width: 240px;
        height: 370px;
        border-radius: 12px 12px 5px 5px;
        background: linear-gradient(90deg, #12364d, #21536c 48%, #102f44);
        box-shadow:
          0 34px 65px rgba(0, 0, 0, 0.46),
          0 0 0 1px rgba(100, 218, 246, 0.15),
          0 0 50px rgba(33, 174, 212, 0.08);
        perspective: 1100px;
      }

      .door-opening {
        position: absolute;
        inset: 12px 13px 0;
        overflow: hidden;
        border-radius: 4px 4px 0 0;
        background:
          radial-gradient(
            circle at 60% 32%,
            rgba(42, 183, 215, 0.18),
            transparent 31%
          ),
          linear-gradient(145deg, #09131b, #03070a 75%);
        box-shadow: inset 0 0 38px rgba(0, 0, 0, 0.9);
      }

      .inside-glow {
        position: absolute;
        top: -10%;
        left: -25%;
        width: 74%;
        height: 120%;
        opacity: 0.3;
        background: linear-gradient(
          90deg,
          rgba(77, 221, 255, 0.22),
          transparent
        );
        filter: blur(18px);
      }

      .person {
        position: absolute;
        top: 42px;
        left: 14px;
        z-index: 2;
        width: 220px;
        height: 300px;
        opacity: 0;
        transform: translateX(-34px) rotate(-4deg);
        transform-origin: 60% 80%;
        animation: person-peek 9s cubic-bezier(0.38, 0.05, 0.24, 1) infinite;
      }

      .character-image {
        position: absolute;
        top: 0;
        left: -34px;
        display: block;
        width: 288px;
        max-width: none;
        height: auto;
        user-select: none;
        filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.3));
        pointer-events: none;
      }

      .person-body {
        position: absolute;
        right: 0;
        bottom: -34px;
        left: 14px;
        height: 130px;
        border-radius: 48% 48% 12px 12px;
        background:
          linear-gradient(
            115deg,
            transparent 0 43%,
            rgba(101, 226, 255, 0.16) 44% 47%,
            transparent 48%
          ),
          linear-gradient(145deg, #166996, #0a3d5f 70%);
      }

      .neck {
        position: absolute;
        top: 128px;
        left: 67px;
        z-index: 2;
        width: 39px;
        height: 45px;
        border-radius: 0 0 15px 15px;
        background: linear-gradient(90deg, #c68561, var(--skin-light));
      }

      .head {
        position: absolute;
        top: 4px;
        left: 28px;
        z-index: 3;
        width: 112px;
        height: 139px;
        border-radius: 47% 45% 46% 48% / 42% 43% 57% 58%;
        background:
          radial-gradient(
            circle at 70% 74%,
            rgba(255, 194, 170, 0.4),
            transparent 12%
          ),
          linear-gradient(
            115deg,
            #c98761,
            var(--skin-light) 53%,
            #d4946d
          );
        box-shadow:
          inset 8px -8px 20px rgba(135, 71, 44, 0.13),
          0 12px 24px rgba(0, 0, 0, 0.28);
      }

      .ear {
        position: absolute;
        top: 62px;
        z-index: -1;
        width: 23px;
        height: 30px;
        border-radius: 50%;
        background: var(--skin);
      }

      .ear::after {
        position: absolute;
        inset: 7px 6px;
        border: 2px solid rgba(133, 69, 47, 0.18);
        border-left: 0;
        border-radius: 50%;
        content: "";
      }

      .ear-left {
        left: -11px;
      }

      .ear-right {
        right: -10px;
        transform: scaleX(-1);
      }

      .hair {
        position: absolute;
        top: -8px;
        left: -1px;
        width: 112px;
        height: 55px;
        border-radius: 52% 52% 29% 22%;
        background: linear-gradient(145deg, #25313b, #10161c 66%);
        box-shadow: inset 11px 7px 15px rgba(255, 255, 255, 0.05);
      }

      .hair::after {
        position: absolute;
        top: 30px;
        right: -1px;
        width: 22px;
        height: 37px;
        border-radius: 0 14px 16px 70%;
        background: #11181f;
        content: "";
      }

      .hair-lock {
        position: absolute;
        bottom: -10px;
        width: 24px;
        height: 29px;
        border-radius: 0 0 70% 20%;
        background: var(--hair);
        transform: rotate(13deg);
      }

      .hair-lock-one {
        left: 13px;
      }

      .hair-lock-two {
        bottom: -13px;
        left: 34px;
        transform: rotate(2deg);
      }

      .hair-lock-three {
        bottom: -7px;
        left: 55px;
        transform: rotate(-12deg);
      }

      .eyebrow {
        position: absolute;
        top: 62px;
        width: 27px;
        height: 4px;
        border-radius: 999px;
        background: #563e34;
      }

      .eyebrow-left {
        left: 20px;
        transform: rotate(-5deg);
      }

      .eyebrow-right {
        right: 17px;
        transform: rotate(8deg);
      }

      .eye {
        position: absolute;
        top: 72px;
        width: 25px;
        height: 17px;
        overflow: hidden;
        border-radius: 50%;
        background: #fffaf4;
        animation: character-blink 4.4s steps(1, end) infinite;
      }

      .eye-left {
        left: 21px;
      }

      .eye-right {
        right: 16px;
      }

      .pupil {
        position: absolute;
        top: 4px;
        left: 10px;
        width: 9px;
        height: 9px;
        border: 2px solid #5d9c82;
        border-radius: 50%;
        background: #0b1a1a;
        box-shadow: 0 0 0 2px #86c3a7;
      }

      .pupil::after {
        position: absolute;
        top: 0;
        left: 1px;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: white;
        content: "";
      }

      .nose {
        position: absolute;
        top: 83px;
        left: 53px;
        width: 13px;
        height: 22px;
        border-right: 2px solid rgba(140, 77, 51, 0.3);
        border-bottom: 2px solid rgba(140, 77, 51, 0.24);
        border-radius: 0 0 8px;
        transform: rotate(5deg);
      }

      .cheek {
        position: absolute;
        top: 100px;
        width: 19px;
        height: 9px;
        border-radius: 50%;
        background: rgba(219, 104, 90, 0.17);
        filter: blur(2px);
      }

      .cheek-left {
        left: 12px;
      }

      .cheek-right {
        right: 7px;
      }

      .smile {
        position: absolute;
        top: 108px;
        left: 44px;
        width: 29px;
        height: 14px;
        border-bottom: 3px solid #8c4e46;
        border-radius: 0 0 50% 50%;
        transform: rotate(2deg);
      }

      .hand {
        position: absolute;
        top: 176px;
        right: -6px;
        z-index: 5;
        width: 28px;
        height: 45px;
        border-radius: 48%;
        background: linear-gradient(90deg, #c78661, var(--skin-light));
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.22);
      }

      .hand span {
        position: absolute;
        right: -3px;
        width: 16px;
        height: 8px;
        border-radius: 999px;
        background: var(--skin-light);
      }

      .hand span:nth-child(1) {
        top: 7px;
      }

      .hand span:nth-child(2) {
        top: 17px;
      }

      .hand span:nth-child(3) {
        top: 27px;
      }

      .door {
        position: absolute;
        inset: 12px 13px 0;
        z-index: 3;
        overflow: hidden;
        border: 1px solid rgba(111, 220, 246, 0.22);
        border-radius: 4px 4px 0 0;
        background:
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.04),
            transparent 15% 84%,
            rgba(0, 0, 0, 0.18)
          ),
          linear-gradient(150deg, #16658d, #0b466a 66%, #08324f);
        box-shadow:
          inset 7px 0 14px rgba(97, 220, 250, 0.08),
          inset -12px 0 18px rgba(0, 0, 0, 0.22);
        transform-origin: left center;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        animation: door-open 9s cubic-bezier(0.42, 0, 0.2, 1) infinite;
      }

      .door::after {
        position: absolute;
        inset: 0;
        opacity: 0.42;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          );
        background-size: 26px 26px;
        content: "";
      }

      .door-panel {
        position: absolute;
        right: 24px;
        left: 24px;
        border: 1px solid rgba(155, 230, 250, 0.13);
        border-radius: 5px;
        box-shadow: inset 0 0 18px rgba(2, 22, 36, 0.32);
      }

      .door-panel-top {
        top: 30px;
        height: 113px;
      }

      .door-panel-bottom {
        right: 33px;
        bottom: 27px;
        left: 33px;
        height: 112px;
      }

      .door-plaque {
        position: absolute;
        top: 65px;
        left: 50%;
        z-index: 2;
        display: flex;
        align-items: baseline;
        gap: 3px;
        border: 1px solid rgba(129, 226, 248, 0.28);
        border-radius: 7px;
        padding: 7px 10px;
        background: rgba(3, 24, 37, 0.54);
        color: #d8f7ff;
        font-size: 0.72rem;
        font-weight: 800;
        transform: translateX(-50%);
      }

      .door-plaque strong {
        color: var(--cyan);
      }

      .door-knob {
        position: absolute;
        top: 186px;
        right: 17px;
        z-index: 4;
        width: 25px;
        height: 25px;
        border: 2px solid #8aa8b5;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #ecf7fa,
          #879ba3 40%,
          #40525a 75%
        );
        box-shadow:
          0 3px 8px rgba(0, 0, 0, 0.35),
          0 0 0 5px rgba(5, 34, 50, 0.25);
        animation: knob-turn 9s ease-in-out infinite;
      }

      .door-knob span {
        position: absolute;
        top: 9px;
        right: -13px;
        width: 17px;
        height: 5px;
        border-radius: 4px;
        background: linear-gradient(#b4c8cf, #5b6e76);
      }

      .frame-highlight {
        position: absolute;
        inset: 0;
        z-index: 5;
        border: 2px solid rgba(70, 185, 218, 0.13);
        border-bottom: 0;
        border-radius: 12px 12px 0 0;
        pointer-events: none;
      }

      .speech-anchor {
        position: absolute;
        top: 25%;
        left: calc(46% + 145px);
        z-index: 12;
        width: min(350px, 34vw);
      }

      .speech-bubble {
        position: relative;
        width: 100%;
        opacity: 0;
        border: 1px solid rgba(198, 232, 241, 0.75);
        border-radius: 28px 28px 28px 8px;
        padding: 1.4rem 1.55rem 1.45rem;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.98),
          rgba(231, 244, 248, 0.96)
        );
        box-shadow:
          0 28px 70px rgba(0, 0, 0, 0.35),
          0 0 0 7px rgba(121, 220, 242, 0.035),
          inset 0 1px 0 white;
        color: #10222e;
        transform: translateY(18px) scale(0.88);
        transform-origin: left bottom;
        animation: bubble-show 9s cubic-bezier(0.2, 0.9, 0.2, 1) infinite;
      }

      .bubble-eyebrow {
        display: block;
        margin-bottom: 0.55rem;
        color: #468196;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .speech-bubble h1 {
        margin: 0;
        color: #0b2533;
        font-size: clamp(1.52rem, 3.3vw, 2.18rem);
        font-weight: 820;
        letter-spacing: -0.055em;
        line-height: 1.02;
      }

      .speech-bubble p {
        margin: 0.48rem 0 0;
        color: #287287;
        font-size: clamp(1.03rem, 2vw, 1.28rem);
        font-weight: 680;
        letter-spacing: -0.025em;
      }

      .bubble-tail {
        position: absolute;
        bottom: 4px;
        left: -21px;
        width: 40px;
        height: 34px;
        overflow: hidden;
      }

      .bubble-tail::before {
        position: absolute;
        right: -16px;
        bottom: 5px;
        width: 35px;
        height: 35px;
        border: 1px solid rgba(198, 232, 241, 0.75);
        background: #eef7f9;
        content: "";
        transform: rotate(45deg);
      }

      .build-note {
        position: absolute;
        bottom: clamp(1.3rem, 4vh, 2.4rem);
        left: 50%;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        margin: 0;
        color: rgba(183, 217, 228, 0.42);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: clamp(0.62rem, 1.7vw, 0.74rem);
        letter-spacing: 0.045em;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .loading-dots {
        display: inline-flex;
        gap: 3px;
        min-width: 25px;
      }

      .loading-dots i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--cyan);
        opacity: 0.25;
        animation: dot-loading 1.3s ease-in-out infinite;
      }

      .loading-dots i:nth-child(2) {
        animation-delay: 0.15s;
      }

      .loading-dots i:nth-child(3) {
        animation-delay: 0.3s;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      @keyframes door-open {
        0%,
        8% {
          transform: rotateY(0deg);
        }
        12% {
          transform: rotateY(-5deg);
        }
        25%,
        73% {
          transform: rotateY(-79deg);
        }
        87%,
        100% {
          transform: rotateY(0deg);
        }
      }

      @keyframes knob-turn {
        0%,
        7%,
        88%,
        100% {
          transform: rotate(0deg);
        }
        10%,
        17% {
          transform: rotate(24deg);
        }
        22%,
        78% {
          transform: rotate(0deg);
        }
      }

      @keyframes person-peek {
        0%,
        18% {
          opacity: 0;
          transform: translateX(-34px) rotate(-4deg);
        }
        27% {
          opacity: 1;
        }
        34%,
        68% {
          opacity: 1;
          transform: translateX(22px) rotate(1.5deg);
        }
        78%,
        100% {
          opacity: 0;
          transform: translateX(-35px) rotate(-5deg);
        }
      }

      @keyframes bubble-show {
        0%,
        25% {
          opacity: 0;
          transform: translateY(18px) scale(0.88);
        }
        32%,
        67% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        74%,
        100% {
          opacity: 0;
          transform: translateY(-8px) scale(0.96);
        }
      }

      @keyframes character-blink {
        0%,
        45%,
        49%,
        100% {
          transform: scaleY(1);
        }
        46%,
        48% {
          transform: scaleY(0.12);
        }
      }

      @keyframes status-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(94, 227, 164, 0.48);
        }
        75%,
        100% {
          box-shadow: 0 0 0 8px rgba(94, 227, 164, 0);
        }
      }

      @keyframes room-breathe {
        0%,
        100% {
          opacity: 0.68;
          transform: translateX(-50%) scale(0.96);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) scale(1.04);
        }
      }

      @keyframes dot-loading {
        0%,
        70%,
        100% {
          opacity: 0.2;
          transform: translateY(0);
        }
        35% {
          opacity: 0.9;
          transform: translateY(-3px);
        }
      }

      @media (max-width: 720px) {
        .brand-name {
          max-width: 8.5rem;
          line-height: 1.05;
        }

        .status-pill {
          padding: 0.43rem 0.58rem;
          font-size: 0.54rem;
          letter-spacing: 0.05em;
        }

        .speech-anchor {
          top: 17%;
          left: 50%;
          width: min(84vw, 350px);
          transform: translateX(-50%);
        }

        .speech-bubble {
          border-radius: 23px 23px 10px 23px;
          padding: 1.08rem 1.2rem 1.12rem;
          transform-origin: center bottom;
        }

        .bubble-tail {
          bottom: -28px;
          left: calc(50% - 20px);
          transform: rotate(-90deg);
        }

        .door-scene {
          --door-scale: 0.76;
          top: 64%;
          left: 50%;
        }

        .build-note {
          bottom: 1rem;
        }
      }

      @media (max-width: 390px) {
        .brand {
          top: 1rem;
        }

        .brand-mark {
          width: 2.15rem;
          height: 2.15rem;
          border-radius: 0.68rem;
        }

        .brand-name {
          max-width: 7rem;
          font-size: 0.78rem;
        }

        .status-pill {
          gap: 0.35rem;
          padding-inline: 0.48rem;
        }

        .speech-anchor {
          top: 15.5%;
        }

        .door-scene {
          --door-scale: 0.7;
          top: 64.5%;
        }
      }

      @media (max-height: 620px) and (orientation: landscape) {
        .brand {
          top: 1rem;
        }

        .door-scene {
          --door-scale: 0.72;
          top: 58%;
          left: 38%;
        }

        .speech-anchor {
          top: 24%;
          left: 54%;
          width: min(350px, 38vw);
          transform: none;
        }

        .build-note {
          right: 1.4rem;
          bottom: 1rem;
          left: auto;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }

        .door {
          transform: rotateY(-79deg);
        }

        .person {
          opacity: 1;
          transform: translateX(22px) rotate(1.5deg);
        }

        .speech-bubble {
          opacity: 1;
          transform: none;
        }
      }
    </style>
